name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research extras (z3, python-sat)
        run: python -m pip install ".[research]"
      - name: Source lock covers every checker source and matches
        run: python -m soko_mcp.integrity
      - name: Build the native engine from source
        run: g++ -O3 -pthread -std=c++20 cpp/soko_engine.cpp -o cpp/build/soko_engine
      - name: Unit, regression and differential tests
        run: python -m unittest discover -s tests -v
