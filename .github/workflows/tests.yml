name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research extras (z3, python-sat)
        run: python -m pip install ".[research]"
      - name: Source lock covers every checker source and matches
        run: python -m soko_mcp.integrity
      - name: Build the native engine from source (a failed build fails CI instead of dropping the C++ oracle)
        run: python -c "from soko_mcp.engine_bridge import ensure_cpp_engine as e; assert e(), 'C++ engine did not build'"
      - name: Unit, regression and differential tests
        run: python -m unittest discover -s tests -v
