[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soko-verified-mcp"
version = "0.2.0"
description = "Sokoban MCP differential replay and bounded exact-state search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
soko-verified-mcp = "soko_mcp.__main__:main"

[tool.setuptools.package-data]
soko_mcp = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["soko_mcp*"]
